name: Auto Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-release:
    name: Check VERSION & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION against existing releases/tags
        id: version_check
        run: |
          git fetch --tags --force
          if [ ! -f VERSION ]; then
            echo "VERSION file not found; nothing to release."
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Skipping build and exiting cleanly."
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Skipping build and exiting cleanly."
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New version detected: ${TAG}"
          echo "is_new=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Python
        if: steps.version_check.outputs.is_new == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build & test dependencies
        if: steps.version_check.outputs.is_new == 'true'
        run: |
          python -m pip install --upgrade pip build twine pytest
          python -m pip install -e ".[download]"

      - name: Run unit tests
        if: steps.version_check.outputs.is_new == 'true'
        run: python -m pytest -q

      - name: Build distribution packages
        if: steps.version_check.outputs.is_new == 'true'
        run: |
          python -m build
          python -m twine check dist/*

      - name: Create tag and publish GitHub Release
        if: steps.version_check.outputs.is_new == 'true'
        run: |
          TAG="${{ steps.version_check.outputs.tag }}"
          VERSION="${{ steps.version_check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          gh release create "${TAG}" dist/* \
            --title "cenima-cli ${TAG}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
