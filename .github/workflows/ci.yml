name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip build twine

      - name: Install project
        run: python -m pip install -e ".[download]"

      - name: Install native tools on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mpv

      - name: Install native tools on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg mpv

      - name: Install native tools on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install ffmpeg mpv -y

      - name: Run unit and integration tests
        env:
          CINEMA_LIVE_CHECKS: "0"
          CINEMA_SKIP_LIVE: "1"
        run: python -m unittest discover -s tests -q

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Smoke console launchers
        shell: bash
        run: |
          cinema-cli --help >/dev/null
          cenima-cli --help >/dev/null
          cenima --help >/dev/null
