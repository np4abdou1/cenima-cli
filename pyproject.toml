[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cenima-cli"
version = "0.2"
description = "A cinematic terminal app to browse and stream movies and series with mpv."
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    { name = "np4abdou1" }
]
maintainers = [
    { name = "Abdelilah Elgallati" }
]
keywords = ["movies", "streaming", "anime", "series", "arabic", "cli", "mpv", "fzf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
requires-python = ">=3.9"
dependencies = [
    "curl_cffi>=0.5.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7"]
download = ["yt-dlp>=2024.10.22"]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.scripts]
cinema-cli = "cenima.cli:main"
cenima-cli = "cenima.cli:main"
cenima = "cenima.cli:main"

[project.urls]
Homepage = "https://github.com/np4abdou1/cenima-cli"
Repository = "https://github.com/np4abdou1/cenima-cli"
Issues = "https://github.com/np4abdou1/cenima-cli/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cenima*"]

[tool.setuptools.package-data]
cenima = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
